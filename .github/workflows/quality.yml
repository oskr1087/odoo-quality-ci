name: Reusable Odoo quality

on:
  workflow_call:
    inputs:
      odoo_version:
        type: string
        default: "20.0"
      edition:
        type: string
        default: community
      runtime:
        type: boolean
        default: false
      upgrade:
        type: boolean
        default: false
      tests:
        type: boolean
        default: false
      enforce_gate:
        type: boolean
        default: false
      coverage:
        type: boolean
        default: false
    secrets:
      ENTERPRISE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  audit:
    name: Shared architecture and security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: oskr1087/odoo-quality-ci
          ref: '18.0'
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install "ruff==0.14.3" "black==25.9.0"
      - name: Run shared checks against calling repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/scripts project/audit-report
          cp engine/scripts/{full_audit,architecture_audit,security_audit,security_critical,security_deep,regression_audit,runtime_guards,performance_audit,quality_reporting,quality_gate,code_governance,style_audit,module_audit}.py project/scripts/
          cd project
          python scripts/full_audit.py --output audit-report
          python scripts/architecture_audit.py --output audit-report/architecture.json
          python scripts/security_audit.py --output audit-report/security.json
          python scripts/security_critical.py --root . --output audit-report/security-critical.json
          python scripts/security_deep.py --root . --output audit-report/security-deep.json
          python scripts/performance_audit.py --root . --output audit-report/performance.json
          python scripts/code_governance.py --root . --output audit-report/code-governance.json
          python scripts/style_audit.py --root . --output audit-report/style.json
          python scripts/module_audit.py --root . --output audit-report/modules.json
          if [ -n '${{ github.event.pull_request.base.sha }}' ]; then
            python scripts/regression_audit.py --root . --base '${{ github.event.pull_request.base.sha }}' --output audit-report/regressions.json
            python scripts/code_governance.py --root . --base '${{ github.event.pull_request.base.sha }}' --output audit-report/code-governance.json
            python scripts/style_audit.py --root . --base '${{ github.event.pull_request.base.sha }}' --output audit-report/style.json
          else
            echo 'Regression diff skipped: not a pull request event'
          fi
          python scripts/runtime_guards.py --root . --odoo-version '${{ inputs.odoo_version }}' --output audit-report/runtime-guards.json
      - name: Evaluate configured quality gate
        if: ${{ inputs.enforce_gate }}
        shell: bash
        run: |
          cd project
          if [ -f .odoo-qa-policy.json ]; then
            python scripts/quality_gate.py --directory audit-report --policy .odoo-qa-policy.json
          else
            python scripts/quality_gate.py --directory audit-report
          fi
      - name: Build SARIF and QA scorecard
        if: always()
        run: |
          cd project
          python scripts/quality_reporting.py --directory audit-report
      - name: Publish summaries
        if: always()
        shell: bash
        run: |
          for file in project/audit-report/{summary,architecture-summary,security-summary,quality-summary}.md; do
            if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-odoo-quality-report
          path: project/audit-report/
          if-no-files-found: warn

  runtime:
    name: Odoo runtime installation and update
    if: ${{ inputs.runtime && inputs.edition == 'community' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/checkout@v4
        with:
          repository: oskr1087/odoo-quality-ci
          ref: '18.0'
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: ${{ inputs.odoo_version }}
          path: odoo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev
          python -m pip install -r odoo/requirements.txt
          python -m pip install 'coverage[toml]==7.10.7'
      - name: Install and optionally update modules
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: odoo
          PGPASSWORD: odoo
          DO_UPGRADE: ${{ inputs.upgrade }}
          DO_TESTS: ${{ inputs.tests }}
          DO_COVERAGE: ${{ inputs.coverage }}
        run: bash engine/scripts/runtime_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-odoo-runtime-logs
          path: runtime-logs/
          if-no-files-found: warn
